name: Build & release Linux packages

# Builds the portable Linux packages in the cloud and attaches them to a
# GitHub Release. Building on ubuntu-22.04 (glibc 2.35 — the oldest currently
# available runner) means the frozen backend runs on any glibc >= 2.35:
# Ubuntu 22.04 / 24.04, Debian 12+, Fedora, Kali, etc. No local Docker needed,
# and packages upload themselves — no manual 100 MB+ uploads.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the packages to (must already exist)"
        required: true
        default: v1.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install rpm build tooling
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Freeze backend (PyInstaller)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller wsproto
          pyinstaller --noconfirm --name wifi-backend \
            --collect-all uvicorn --collect-all websockets --collect-all wsproto \
            --collect-submodules app --add-data app/wordlists:app/wordlists \
            run_server.py

      - name: Build frontend & package app
        working-directory: gui
        run: |
          npm ci
          npm run build
          npm run electron:build
          npx electron-builder --linux AppImage deb rpm --publish never

      - name: List built artifacts
        run: ls -lh gui/release/*.AppImage gui/release/*.deb gui/release/*.rpm

      - name: Attach packages to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            gui/release/*.AppImage
            gui/release/*.deb
            gui/release/*.rpm
